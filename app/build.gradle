plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.chaquo.python'
}

// Signing identity is local release configuration, never a checked-in secret.
def releaseSigningVariables = [
    storeFile: 'PG_SIGNING_STORE_FILE', storePassword: 'PG_SIGNING_STORE_PASSWORD',
    keyAlias: 'PG_SIGNING_KEY_ALIAS', keyPassword: 'PG_SIGNING_KEY_PASSWORD'
]
def releaseSigningValues = releaseSigningVariables.collectEntries { field, variable ->
    [(field): providers.environmentVariable(variable).orNull]
}
def releaseSigningComplete = releaseSigningValues.values().every { it != null && !it.isEmpty() }
def validateReleaseSigningEnvironment = tasks.register('validateReleaseSigningEnvironment') {
    doLast {
        def missing = releaseSigningVariables.findAll { field, variable -> !releaseSigningValues[field] }.values()
        if (!missing.isEmpty()) throw new GradleException('Release signing requires environment variables: ' + missing.join(', '))
        def keyStore = new File(releaseSigningValues.storeFile)
        def resolved = keyStore.canonicalFile.toPath()
        if (!keyStore.isAbsolute() || !keyStore.isFile()) {
            throw new GradleException('Release keystore must be an existing absolute path outside the repository or in ignored signing/')
        }
        def checkout = rootProject.projectDir.canonicalFile.toPath()
        def gitExit = { List<String> arguments ->
            try {
                def process = new ProcessBuilder(['git'] + arguments).directory(rootProject.projectDir).redirectErrorStream(true).start()
                process.inputStream.readAllBytes()
                return process.waitFor()
            } catch (IOException ignored) {
                throw new GradleException('Cannot verify that the local signing keystore is ignored and untracked')
            }
        }
        [keyStore.absoluteFile.toPath(), resolved].toSet().each { candidate ->
            if (candidate.startsWith(checkout)) {
                def relative = checkout.relativize(candidate)
                if (relative.nameCount == 0 || relative.getName(0).toString() != 'signing') {
                    throw new GradleException('Release keystore must be outside the repository or in ignored signing/')
                }
                def path = relative.toString().replace('\\', '/')
                if (gitExit(['check-ignore', '--no-index', '--quiet', '--', path]) != 0 ||
                    gitExit(['--literal-pathspecs', 'ls-files', '--error-unmatch', '--', path]) != 1) {
                    throw new GradleException('Repository signing keystore must be Git-ignored and untracked')
                }
            }
        }
    }
}
android {
    namespace 'dev.pgproxy.app'
    compileSdk { version = release(37) { minorApiLevel = 2 } }
    defaultConfig {
        applicationId 'dev.pgproxy.app'
        minSdk 28
        targetSdk 35
        versionCode 20
        versionName '0.2.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildFeatures { compose true; buildConfig true }
    packaging { jniLibs { useLegacyPackaging true } }
    flavorDimensions 'abi'
    productFlavors {
        arm64 { dimension 'abi'; ndk { abiFilters 'arm64-v8a' } }
        x64 { dimension 'abi'; ndk { abiFilters 'x86_64' } }
    }
    signingConfigs {
        if (releaseSigningComplete) {
            create('pgRelease') {
                storeFile = file(releaseSigningValues.storeFile)
                storePassword = releaseSigningValues.storePassword
                keyAlias = releaseSigningValues.keyAlias
                keyPassword = releaseSigningValues.keyPassword
                enableV1Signing = false
                enableV2Signing = true
                enableV3Signing = true
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            debuggable false
            if (releaseSigningComplete) signingConfig = signingConfigs.getByName('pgRelease')
        }
    }
}
tasks.configureEach {
    if (name.startsWith('pre') && name.endsWith('ReleaseBuild')) dependsOn(validateReleaseSigningEnvironment)
}
chaquopy {
    defaultConfig {
        version = '3.14'
        pip {
            options '--find-links', rootProject.file('artifacts/wheels').absolutePath
            options '--constraint', rootProject.file('requirements-lock.txt').absolutePath
            install 'fastapi==0.135.2'
            install 'uvicorn==0.42.0'
            install 'httpx[http2]==0.28.1'
            install 'pydantic==2.14.1'
            install 'pydantic-core==2.50.1'
        }
    }
    sourceSets { main { srcDir '../backend' } }
}
dependencies {
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.compose.material3:material3:1.4.0'
    implementation 'androidx.compose.material:material-icons-extended:1.7.8'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.4'
    implementation 'org.mozilla.geckoview:geckoview:159.0.20261022150525'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    // Compose 1.9.4 otherwise selects Espresso 3.5.0, whose InputManager
    // reflection fails on Android 16.1 before the first UI interaction.
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4:1.9.4'
    androidTestImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2'
    androidTestImplementation 'com.google.code.findbugs:jsr305:3.0.2'
    debugImplementation 'androidx.compose.ui:ui-test-manifest:1.9.4'
}
